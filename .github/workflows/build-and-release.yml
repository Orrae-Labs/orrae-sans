name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libharfbuzz-bin zstd
          python -m pip install --requirement requirements.txt

      - name: Reject non-font media
        shell: bash
        run: |
          if find . -path ./.git -prune -o -type f \( \
            -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o \
            -iname '*.gif' -o -iname '*.webp' -o -iname '*.mp4' -o \
            -iname '*.mov' \) -print -quit | grep -q .; then
            echo 'Raster images or video are not permitted in this font repository.' >&2
            exit 1
          fi

      - name: Build and validate
        env:
          FONTTOOLS_PYTHON: python
        run: ./src/build-font.sh

      - name: Run Google Fonts QA
        shell: bash
        run: |
          python -m venv build/fontbakery-ci
          build/fontbakery-ci/bin/pip install --requirement requirements-fontbakery.txt
          build/fontbakery-ci/bin/fontbakery check-googlefonts \
            --skip-network \
            --succinct \
            dist/OrraeSans-Regular.ttf

      - name: Confirm generated files are not tracked
        shell: bash
        run: |
          if git ls-files 'dist/**' | grep -q .; then
            echo 'Generated files in dist must not be committed.' >&2
            exit 1
          fi

      - name: Package downloads
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            package_version=$(node --print "require('./package.json').version")
            if [[ "v$package_version" != "$GITHUB_REF_NAME" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match package version v$package_version." >&2
              exit 1
            fi
          fi
          ./src/package-release.sh "${GITHUB_REF_NAME//\//-}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: orrae-sans-${{ github.run_id }}
          path: |
            release/*.tar.zst
            release/*.tgz
            release/SHA256SUMS
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.tar.zst \
            release/*.tgz \
            release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Orrae Sans ${GITHUB_REF_NAME#v}"
